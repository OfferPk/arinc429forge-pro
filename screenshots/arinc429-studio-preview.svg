<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGradAv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="avAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGradAv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131d33"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGradAv)"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0b1220" stroke="#243759" stroke-width="1"/>
  <rect x="25" y="14" width="85" height="32" rx="4" fill="url(#avAccent)"/>
  <text x="67" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ARINC 429</text>
  <text x="125" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">ARINC429Forge Pro</text>
  <text x="290" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">v1.0.0</text>
  <text x="125" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Commercial Avionics Data Bus Studio &amp; DO-326A Airworthiness Security</text>

  <!-- Status Pill -->
  <rect x="940" y="17" width="235" height="26" rx="13" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
  <circle cx="955" cy="30" r="4" fill="#10b981"/>
  <text x="968" y="34" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Avionics Bus Active (100 kbps / BPRZ)</text>

  <!-- Navigation Tabs -->
  <rect x="0" y="60" width="1200" height="42" fill="#0b1220" stroke="#243759" stroke-width="1"/>
  <!-- Tab 1 Active -->
  <rect x="30" y="60" width="190" height="40" fill="#131d33"/>
  <line x1="30" y1="101" x2="220" y2="101" stroke="#38bdf8" stroke-width="2"/>
  <text x="125" y="85" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎛️ 32-Bit Word Studio</text>

  <text x="320" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">🔍 Avionics Bus Dissector</text>
  <text x="510" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">✈️ Cockpit PFD Simulator</text>
  <text x="700" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">🛡️ DO-326A Cyber Auditor</text>
  <text x="880" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">🔒 Bridge Hardening</text>
  <text x="1050" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">📦 WireShark PCAP</text>

  <!-- Main Content Grid -->
  <!-- Left Card: Input & Configuration -->
  <rect x="30" y="125" width="550" height="540" rx="8" fill="url(#cardGradAv)" stroke="#243759" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">32-Bit ARINC Word Synthesizer</text>
  <text x="50" y="172" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Generate compliant Mark 33 DITS Words with Bit-Reversed Octal Labels</text>

  <!-- Input Fields -->
  <text x="50" y="205" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Equipment Label (Octal)</text>
  <rect x="50" y="215" width="240" height="32" rx="4" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="60" y="235" fill="#38bdf8" font-family="monospace" font-size="11">203 — Pressure Altitude (ft)</text>

  <text x="310" y="205" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Physical Engineering Value</text>
  <rect x="310" y="215" width="245" height="32" rx="4" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="320" y="235" fill="#10b981" font-family="monospace" font-size="11">35000.0 (Feet)</text>

  <text x="50" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Source/Destination ID (SDI, Bits 9-10)</text>
  <rect x="50" y="285" width="240" height="32" rx="4" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="60" y="305" fill="#e2e8f0" font-family="monospace" font-size="11">01 — Left / System 1 (Capt)</text>

  <text x="310" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sign/Status Matrix (SSM, Bits 30-31)</text>
  <rect x="310" y="285" width="245" height="32" rx="4" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="320" y="305" fill="#10b981" font-family="monospace" font-size="11">11 — Normal Operation (NO)</text>

  <text x="50" y="345" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Parity Generation (Bit 32)</text>
  <rect x="50" y="355" width="505" height="32" rx="4" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="60" y="375" fill="#10b981" font-family="monospace" font-size="11">✓ Odd Parity Auto-Generated (ARINC 429 Standard Enforced)</text>

  <!-- Button -->
  <rect x="50" y="420" width="220" height="38" rx="4" fill="url(#avAccent)"/>
  <text x="160" y="443" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pack ARINC 429 Word</text>

  <!-- Right Card: Dissector Tree Inspector -->
  <rect x="610" y="125" width="560" height="540" rx="8" fill="url(#cardGradAv)" stroke="#243759" stroke-width="1" filter="url(#shadow)"/>
  <text x="630" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">32-Bit Word Dissector &amp; Bit Inspector</text>
  <text x="630" y="172" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Decoded Value, SDI Source, SSM Status &amp; Parity Check</text>

  <!-- Decoded Summary Box -->
  <rect x="630" y="195" width="520" height="42" rx="4" fill="#0b1220" stroke="#243759" stroke-width="1"/>
  <text x="645" y="221" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Decoded Signal:</text>
  <text x="750" y="221" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">Label 203 (Altitude) = 35000.0 ft | SDI 01 | SSM 11 | Odd OK</text>

  <!-- Code Tree Box -->
  <rect x="630" y="250" width="520" height="390" rx="4" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="645" y="270" fill="#38bdf8" font-family="monospace" font-size="9.5">{</text>
  <text x="660" y="286" fill="#e2e8f0" font-family="monospace" font-size="9.5">"word32": 3796123841,</text>
  <text x="660" y="302" fill="#38bdf8" font-family="monospace" font-size="9.5">"hex": "E24420C1",</text>
  <text x="660" y="318" fill="#a855f7" font-family="monospace" font-size="9.5">"binary": "11100010010001000010000011000001",</text>
  <text x="660" y="334" fill="#e2e8f0" font-family="monospace" font-size="9.5">"label": {</text>
  <text x="675" y="350" fill="#10b981" font-family="monospace" font-size="9.5">"octal": "203",</text>
  <text x="675" y="366" fill="#10b981" font-family="monospace" font-size="9.5">"name": "Pressure Altitude",</text>
  <text x="675" y="382" fill="#10b981" font-family="monospace" font-size="9.5">"rawByteHex": "C1" (Bit-Reversed on Wire)</text>
  <text x="660" y="398" fill="#e2e8f0" font-family="monospace" font-size="9.5">},</text>
  <text x="660" y="414" fill="#e2e8f0" font-family="monospace" font-size="9.5">"sdi": { "code": 1, "desc": "Left / System 1 (Captain ADC)" },</text>
  <text x="660" y="430" fill="#e2e8f0" font-family="monospace" font-size="9.5">"dataField": { "decodedValue": 35000.0, "units": "ft", "type": "BNR" },</text>
  <text x="660" y="446" fill="#10b981" font-family="monospace" font-size="9.5">"ssm": { "code": 3, "desc": "Normal Operation (NO)", "isNormal": true },</text>
  <text x="660" y="462" fill="#10b981" font-family="monospace" font-size="9.5">"parity": { "bit": 1, "oddParityValid": true }</text>
  <text x="645" y="478" fill="#38bdf8" font-family="monospace" font-size="9.5">}</text>

  <!-- Status Bar -->
  <rect x="630" y="595" width="520" height="35" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
  <text x="645" y="617" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✓ ARINC 429 Word Validated: 32 bits, BNR scale verified, Odd Parity matches wire standard.</text>
</svg>
