<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGradAvArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#091020"/>
    </linearGradient>
    <linearGradient id="lruCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111d33"/>
      <stop offset="100%" stop-color="#0c1527"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGradAvArch)"/>

  <!-- Title & Banner -->
  <text x="600" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">ARINC 429 Avionics Data Bus &amp; Airworthiness Security Architecture</text>
  <text x="600" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">32-Bit Word Frame, Bit-Reversed Octal Labels, BNR/BCD Encodings &amp; FAA DO-326A / ED-202A Cybersecurity</text>

  <!-- 32-Bit Word Layout Visualizer (Top) -->
  <rect x="50" y="105" width="1100" height="150" rx="8" fill="url(#lruCard)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="50" y="105" width="1100" height="28" rx="8" fill="#0369a1"/>
  <text x="600" y="124" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Standard 32-Bit ARINC 429 Word Bitmask Structure (Mark 33 DITS)</text>

  <!-- Bit Blocks -->
  <!-- Parity (Bit 32) -->
  <rect x="75" y="145" width="80" height="50" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="115" y="168" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Bit 32</text>
  <text x="115" y="186" fill="#fecaca" font-family="monospace" font-size="9" text-anchor="middle">Odd Parity</text>

  <!-- SSM (Bits 30-31) -->
  <rect x="165" y="145" width="120" height="50" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="225" y="168" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Bits 31-30</text>
  <text x="225" y="186" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">SSM Status</text>

  <!-- Data Field (Bits 11-29) -->
  <rect x="295" y="145" width="460" height="50" rx="4" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1"/>
  <text x="525" y="168" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Bits 29-11 (19 Bits)</text>
  <text x="525" y="186" fill="#bae6fd" font-family="monospace" font-size="9" text-anchor="middle">BNR Two's Complement (Fractional) / BCD Decimal Digits</text>

  <!-- SDI (Bits 9-10) -->
  <rect x="765" y="145" width="110" height="50" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="820" y="168" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Bits 10-9</text>
  <text x="820" y="186" fill="#fde68a" font-family="monospace" font-size="9" text-anchor="middle">SDI Routing</text>

  <!-- Label (Bits 1-8) -->
  <rect x="885" y="145" width="240" height="50" rx="4" fill="#4c1d95" stroke="#a855f7" stroke-width="1"/>
  <text x="1005" y="168" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Bits 8-1 (8 Bits)</text>
  <text x="1005" y="186" fill="#e9d5ff" font-family="monospace" font-size="9" text-anchor="middle">Octal Label (Bit-Reversed on Wire)</text>

  <text x="600" y="225" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Physical Layer: Twisted Shielded Pair • Bipolar Return-to-Zero (BPRZ) • ±10V High (+5V Null, -10V Low) • 100 kbps High Speed</text>

  <!-- Avionics LRU Architecture (Middle) -->
  <!-- Transmitters (Left) -->
  <rect x="50" y="285" width="320" height="360" rx="8" fill="url(#lruCard)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="50" y="285" width="320" height="30" rx="8" fill="#0369a1"/>
  <text x="210" y="305" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Avionics Sensors (Simplex Transmitters)</text>

  <!-- ADC 1 (Captain) -->
  <rect x="70" y="330" width="280" height="85" rx="6" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="210" y="352" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Air Data Computer 1 (SDI 01 / Capt)</text>
  <text x="85" y="375" fill="#e2e8f0" font-family="monospace" font-size="9.5">• Label 203: Altitude (35,000 ft)</text>
  <text x="85" y="395" fill="#10b981" font-family="monospace" font-size="9.5">• Label 206: Airspeed (320 kts) | L205: Mach 0.82</text>

  <!-- ADC 2 (First Officer) -->
  <rect x="70" y="430" width="280" height="85" rx="6" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="210" y="452" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Air Data Computer 2 (SDI 10 / F/O)</text>
  <text x="85" y="475" fill="#e2e8f0" font-family="monospace" font-size="9.5">• Label 203: Altitude (35,000 ft)</text>
  <text x="85" y="495" fill="#10b981" font-family="monospace" font-size="9.5">• Cross-Channel Dual Sensor Redundancy Check</text>

  <!-- IRS / ADIRU -->
  <rect x="70" y="530" width="280" height="95" rx="6" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="210" y="552" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Inertial Reference System (IRS 1)</text>
  <text x="85" y="575" fill="#e2e8f0" font-family="monospace" font-size="9.5">• Label 320: Magnetic Heading (270.0°)</text>
  <text x="85" y="595" fill="#38bdf8" font-family="monospace" font-size="9.5">• Label 324: Pitch (+2.5°) | Label 325: Roll (0.0°)</text>
  <text x="85" y="613" fill="#cbd5e1" font-family="monospace" font-size="9.5">• Label 310/311: Present Position Lat/Long</text>

  <!-- Data Bus Twisted Pair Cable -->
  <rect x="420" y="380" width="360" height="40" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="405" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ARINC 429 Bus (Twisted Shielded Pair / BPRZ)</text>

  <!-- Arrows from Transmitters to Bus -->
  <path d="M 350 372 L 420 395" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 350 472 L 420 405" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M 350 577 L 420 415" stroke="#a855f7" stroke-width="2" fill="none"/>

  <!-- Receivers & Flight Deck (Right) -->
  <rect x="830" y="285" width="320" height="360" rx="8" fill="url(#lruCard)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="830" y="285" width="320" height="30" rx="8" fill="#065f46"/>
  <text x="990" y="305" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Flight Deck Receivers &amp; Flight Controls</text>

  <!-- PFD / EFIS Display -->
  <rect x="850" y="330" width="280" height="85" rx="6" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="990" y="352" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Primary Flight Display (PFD / EFIS)</text>
  <text x="865" y="375" fill="#10b981" font-family="monospace" font-size="9.5">• Real-time Altimeter Tape &amp; Speed Tape</text>
  <text x="865" y="395" fill="#f59e0b" font-family="monospace" font-size="9.5">• Artificial Horizon Pitch / Roll Driven</text>

  <!-- Flight Management Computer (FMC) -->
  <rect x="850" y="430" width="280" height="85" rx="6" fill="#050811" stroke="#243759" stroke-width="1"/>
  <text x="990" y="452" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Flight Management Computer (FMC)</text>
  <text x="865" y="475" fill="#e2e8f0" font-family="monospace" font-size="9.5">• Autopilot Navigation &amp; LNAV/VNAV Guidance</text>
  <text x="865" y="495" fill="#10b981" font-family="monospace" font-size="9.5">• Dual-Sensor Cross-Channel Discrepancy Alert</text>

  <!-- FAA DO-326A Cyber Security Shield -->
  <rect x="850" y="530" width="280" height="95" rx="6" fill="#050811" stroke="#ef4444" stroke-width="1.5"/>
  <text x="990" y="552" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FAA DO-326A / ED-202A Cyber Shield</text>
  <text x="865" y="575" fill="#cbd5e1" font-family="monospace" font-size="9.5">• Kinematic Plausibility Boundary Checks</text>
  <text x="865" y="595" fill="#cbd5e1" font-family="monospace" font-size="9.5">• Bus Babbling &amp; Refresh Rate Monitoring</text>
  <text x="865" y="613" fill="#10b981" font-family="monospace" font-size="9.5">• Optical Data Diode &amp; nftables Isolation</text>

  <!-- Arrows from Bus to Receivers -->
  <path d="M 780 395 L 850 372" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 780 405 L 850 472" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M 780 415 L 850 577" stroke="#ef4444" stroke-width="2" fill="none"/>
</svg>
